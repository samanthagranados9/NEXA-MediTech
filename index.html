<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXA MediTech | CircuitFlex</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Estilos mínimos para el modal de login -->
  <style>
    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .login-card input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .login-card button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .login-card button:hover { background-color: #1d4ed8; }
    .error-msg { color: #dc2626; font-size: 0.875rem; margin-top: 8px; display: none; }
    .hidden { display: none !important; }
    .user-info { display: flex; align-items: center; gap: 10px; color: #fff; margin-left: auto; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Overlay Modal de Login -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <img src="assets/logo_nexa_meditech.png" alt="NEXA MediTech" style="max-width: 120px; margin-bottom: 1rem;">
      <h2>Iniciar Sesión</h2>
      <p style="color: #64748b; font-size: 0.9rem;">Accede al control de CircuitFlex</p>
      
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
        <input type="password" id="loginPassword" placeholder="Contraseña" required>
        <button type="submit" id="loginButton">Ingresar</button>
      </form>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>
  
  <!-- Contenido principal de la app -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/logo_nexa_meditech.png" alt="NEXA MediTech">
      <span>CircuitFlex</span>
    </a>
    <nav class="nav">
      <a href="index.html" data-page="inicio"><span class="ico">⌂</span>Inicio</a>
      <a href="grafico.html" data-page="grafico"><span class="ico">▥</span>Gráfico</a>
      <a href="niveles.html" data-page="niveles"><span class="ico">☷</span>Niveles</a>
    </nav>
    <!-- Botón de Cerrar Sesión -->
    <div class="user-info">
      <span id="userEmailDisplay" style="font-size: 0.85rem;"></span>
      <button id="logoutBtn" class="logout-btn hidden">Salir</button>
    </div>
  </header>

  <main class="page">
    <section class="welcome">
      <img class="welcome-logo" src="assets/logo_nexa_meditech.png" alt="NEXA MediTech">
      <h1>¡Bienvenido!</h1>
      <p class="subtitle">Control de CircuitFlex</p>
    </section>

    <section class="card status-card">
      <div class="status-title">Estado de la media</div>
      <div class="status-body">
        <div class="status-light" id="statusLight"></div>
        <div>
          <div class="status-word" id="statusWord">APAGADO</div>
          <div class="status-description" id="statusDesc">La media está apagada</div>
        </div>
      </div>
    </section>

	<div class="home-actions">
	  <button class="big-btn power" id="powerButton">Encender</button>
	  <button class="big-btn simultaneo" id="simultaneoButton" style="background-color: #0284c7; color: white; margin-top: 10px;">⚡ &nbsp; Modo Simultáneo</button>
	  <a class="big-btn graph-link" href="grafico.html">▥ &nbsp; Niveles o Gráficos</a>
	</div>
  </main>

  <footer>© 2026 NEXA MediTech. Todos los derechos reservados.</footer>

  <!-- Firebase y JS de Autenticación -->
  <script type="module" src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="index_dashboard.js"></script>
</body>
</html>
